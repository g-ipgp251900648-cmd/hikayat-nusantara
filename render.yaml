services:
  - type: web
    name: hikayat-nusantara-portal
    runtime: node
    plan: free
    branch: main
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    # Add CERTIFICATE_TEACHER_KEY as a private secret in Render Environment.
    # Do NOT commit its real value to GitHub.
    envVars:
      - key: NODE_ENV
        value: production
