services:
  - type: web
    name: hikayat-nusantara-portal
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install --omit=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      # Configure these privately in the Render service environment.
      # NEVER commit actual storage keys to GitHub.
      - key: HN_VIDEO_S3_ENDPOINT
        sync: false
      - key: HN_VIDEO_S3_REGION
        sync: false
      - key: HN_VIDEO_S3_BUCKET
        sync: false
      - key: HN_VIDEO_S3_ACCESS_KEY_ID
        sync: false
      - key: HN_VIDEO_S3_SECRET_ACCESS_KEY
        sync: false
