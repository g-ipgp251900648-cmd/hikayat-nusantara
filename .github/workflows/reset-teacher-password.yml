name: One-time Teacher Password Recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover-teacher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies without lockfile
        run: npm install --omit=dev --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Reset only the specified teacher password
        env:
          DATABASE_URL: ${{ secrets.HN_RECOVERY_DATABASE_URL }}
          HN_RESET_TEACHER_PASSWORD: ${{ secrets.HN_RESET_TEACHER_PASSWORD }}
        run: node scripts/reset-teacher-password.mjs
