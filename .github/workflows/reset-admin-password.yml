name: One-time Admin Password Recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reset-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies without lockfile
        run: npm install --omit=dev --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Reset only HN-ADM-001 credentials
        env:
          DATABASE_URL: ${{ secrets.HN_RECOVERY_DATABASE_URL }}
          HN_RESET_ADMIN_PASSWORD: ${{ secrets.HN_RESET_ADMIN_PASSWORD }}
        run: node scripts/reset-admin-password.mjs
