name: PostgreSQL account and class isolation integration
on:
  pull_request:
    branches: [main]
    paths:
      - 'auth/**'
      - 'tests/auth-postgres.integration.test.mjs'
      - '.github/workflows/verify-postgres-auth.yml'
      - 'server.js'
      - 'package.json'
      - 'scripts/bootstrap-admin.mjs'
  workflow_dispatch:

jobs:
  account-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-credential
          POSTGRES_DB: hikayat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hikayat_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      HN_TEST_DATABASE_URL: postgresql://postgres:ci-only-credential@127.0.0.1:5432/hikayat_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Run PostgreSQL integration tests (isolated CI database)
        run: node --test tests/auth-postgres.integration.test.mjs
