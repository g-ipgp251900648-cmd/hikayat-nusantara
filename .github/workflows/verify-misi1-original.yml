name: Verify all four Hikayat Nusantara missions
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/misi1-ai-studio-original-import, fix/render-vite-module-not-found]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Exercise a cold build with NO node_modules directory.
      # The build script must install Vite if Render has not installed it.
      - name: Verify JavaScript syntax
        run: npm run check
      - name: Check four original AI Studio games and portal integration
        run: npm test
      - name: Cold-build all four original AI Studio missions
        run: npm run build
        env:
          NODE_ENV: production
          HN_INSPECT_MISI4: '1'
      - name: Verify produced Vite assets
        run: |
          test -f dist/misi1/index.html
          test -f dist/misi1/src/assets/images/story_page_1_1794930837095.jpg
          find dist/misi1/assets -name '*.js' | grep -q .
          test -f dist/misi2/index.html
          find dist/misi2/assets -name '*.js' | grep -q .
          test -f dist/misi3/index.html
          test -f dist/misi4/index.html
          find dist/misi4/assets -name '*.js' | grep -q .
          find dist/misi3/assets -name '*.js' | grep -q .
          find dist/misi2/assets -name '*.css' | grep -q .
