name: One-time GKMP and KPBM Password Recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover-leadership:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies without lockfile
        run: npm install --omit=dev --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Reset only GKMP and KPBM passwords
        env:
          DATABASE_URL: ${{ secrets.HN_RECOVERY_DATABASE_URL }}
          HN_RESET_GKMP_PASSWORD: ${{ secrets.HN_RESET_GKMP_PASSWORD }}
          HN_RESET_KPBM_PASSWORD: ${{ secrets.HN_RESET_KPBM_PASSWORD }}
        run: node scripts/reset-leadership-passwords.mjs
