name: Diagnose Misi 4 preview submission source
on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-misi4.yml'
      - 'scripts/extract-misi4.mjs'
      - 'scripts/patch-misi4-submit.mjs'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect original video submission implementation
        run: |
          node --input-type=module <<'JS'
          import { extractMisiFourSource } from './scripts/extract-misi4.mjs';
          import { readdir,readFile } from 'node:fs/promises';
          import path from 'node:path';
          await extractMisiFourSource();
          async function walk(dir) {
            for (const entry of await readdir(dir, {withFileTypes:true})) {
              const file=path.join(dir,entry.name);
              if(entry.isDirectory()) await walk(file);
              else if(/\.(?:tsx?|jsx?)$/.test(entry.name)){
                const s=await readFile(file,'utf8');
                if(file.endsWith('SubmissionHallModal.tsx')) {
                  console.log('COMPONENT_BEGIN',file);
                  console.log(s.slice(0,13500));
                  console.log('COMPONENT_END');
                }else if(/backendReady|storageHealth|onSubmitToTeacher|handleRealSubmit/.test(s)){
                  console.log('RELATED',file);
                  for(const needle of ['backendReady','storageHealth','onSubmitToTeacher','handleRealSubmit']){
                    const pos=s.indexOf(needle);
                    if(pos>=0)console.log('MATCH',needle,s.slice(Math.max(0,pos-950),pos+1350));
                  }
                }
              }
            }
          }
          await walk('mission-four-ai');
          JS
